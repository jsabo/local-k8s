version: '3'

set: [errexit, nounset, pipefail]

vars:
  # -------------------------------------------------------------------
  # Cluster topology
  # -------------------------------------------------------------------
  CP0: cp-0
  WORKERS: 'worker-0 worker-1'
  NODES: '{{.CP0}} {{.WORKERS}}'

  # -------------------------------------------------------------------
  # Versions
  # -------------------------------------------------------------------
  K8S_VERSION_FULL: '{{default "1.34.2" .K8S_VERSION_FULL}}'
  CALICO_VERSION: '{{default "v3.31.3" .CALICO_VERSION}}'

  # local-path-provisioner (dynamic local storage that cleans up on Delete)
  LOCAL_PATH_VERSION: '{{default "v0.0.33" .LOCAL_PATH_VERSION}}'
  LOCAL_PATH_NS: '{{default "local-path-storage" .LOCAL_PATH_NS}}'
  LOCAL_PATH_MANIFEST_URL: 'https://raw.githubusercontent.com/rancher/local-path-provisioner/{{.LOCAL_PATH_VERSION}}/deploy/local-path-storage.yaml'
  LOCAL_PATH_STORAGECLASS: '{{default "local-path" .LOCAL_PATH_STORAGECLASS}}'
  LOCAL_PATH_DIR: '{{default "/opt/local-path-provisioner" .LOCAL_PATH_DIR}}'

  # -------------------------------------------------------------------
  # Networking (single source of truth)
  # -------------------------------------------------------------------
  POD_CIDR: '{{default "10.48.0.0/16" .POD_CIDR}}'
  SERVICE_CIDR: '{{default "10.49.0.0/16" .SERVICE_CIDR}}'
  DNS_DOMAIN: '{{default "cluster.local" .DNS_DOMAIN}}'

  # -------------------------------------------------------------------
  # Local state / cloud-init
  # -------------------------------------------------------------------
  # IMPORTANT: Anchor these to the Taskfile directory so STATE_DIR never becomes "/"
  # (which caused: touch: /.local-path-*.installed: Read-only file system)
  STATE_DIR: '{{.TASKFILE_DIR}}/.state'
  CLOUD_INIT_TEMPLATE: '{{.TASKFILE_DIR}}/cloud-init.tftpl'
  CLOUD_INIT_RENDERED: '{{.STATE_DIR}}/cloud-init.yaml'

  AUDIT_POLICY_TEMPLATE: '{{.TASKFILE_DIR}}/audit-policy.tftpl'
  AUDIT_POLICY_RENDERED: '{{.STATE_DIR}}/audit-policy.yaml'

  # kubeadm config is now managed outside cloud-init (like audit-policy)
  KUBEADM_CONFIG_TEMPLATE: '{{.TASKFILE_DIR}}/kubeadm-config.tftpl'
  KUBEADM_CONFIG_RENDERED: '{{.STATE_DIR}}/kubeadm-config.yaml'

  # Calico Installation/APIServer custom resources are now templated + rendered like the above.
  CALICO_CUSTOM_RESOURCES_TEMPLATE: '{{.TASKFILE_DIR}}/calico-custom-resources.tftpl'
  CALICO_CUSTOM_RESOURCES_RENDERED: '{{.STATE_DIR}}/calico-custom-resources.yaml'

  KUBECONFIG_OUT: '{{.STATE_DIR}}/kubeconfig'
  ENV_OUT: '{{.STATE_DIR}}/env'

  SSH_KEY_FILE: '{{default (printf "%s/.ssh/id_rsa.pub" .HOME) .SSH_KEY_FILE}}'

  MP_IMAGE: '{{default "24.04" .MP_IMAGE}}'
  MP_CPUS: '{{default "2" .MP_CPUS}}'
  MP_MEM: '{{default "4G" .MP_MEM}}'
  MP_DISK: '{{default "20G" .MP_DISK}}'

  # -------------------------------------------------------------------
  # Stamp files (idempotence without noisy repeats)
  # -------------------------------------------------------------------
  CALICO_STAMP: '{{.STATE_DIR}}/.calico-{{.CALICO_VERSION}}.installed'
  INGRESS_STAMP: '{{.STATE_DIR}}/.ingress-nginx-{{.INGRESS_NODEPORT_HTTP}}-{{.INGRESS_NODEPORT_HTTPS}}.installed'
  LOCAL_PATH_STAMP: '{{.STATE_DIR}}/.local-path-{{.LOCAL_PATH_VERSION}}.installed'
  HEADLAMP_STAMP: '{{.STATE_DIR}}/.headlamp.installed'

  # -------------------------------------------------------------------
  # WordPress app
  # -------------------------------------------------------------------
  WP_NS: '{{default "wordpress-demo" .WP_NS}}'
  WP_RELEASE: '{{default "custom-wordpress" .WP_RELEASE}}'
  WP_CHART: '{{default "./charts/custom-wordpress" .WP_CHART}}'
  WP_RBAC_DIR: '{{default "./rbac" .WP_RBAC_DIR}}'

  WP_DEPLOYER_USER: '{{default "wp-deployer" .WP_DEPLOYER_USER}}'
  WP_ACCESSOR_USER: '{{default "wp-accessor" .WP_ACCESSOR_USER}}'
  WP_DEPLOYER_GROUP: '{{default "wp-deployers" .WP_DEPLOYER_GROUP}}'
  WP_ACCESSOR_GROUP: '{{default "wp-accessors" .WP_ACCESSOR_GROUP}}'

  WP_USERS_DIR: '{{.STATE_DIR}}/users/{{.WP_NS}}'
  WP_DEPLOYER_KUBECONFIG: '{{.WP_USERS_DIR}}/deployer.kubeconfig'
  WP_ACCESSOR_KUBECONFIG: '{{.WP_USERS_DIR}}/accessor.kubeconfig'

  WP_STORAGE_NODE: '{{default "worker-0" .WP_STORAGE_NODE}}'
  WP_STORAGE_CLASS: '{{default .LOCAL_PATH_STORAGECLASS .WP_STORAGE_CLASS}}'
  WP_PVC_WP_SIZE: '{{default "5Gi" .WP_PVC_WP_SIZE}}'
  WP_PVC_MYSQL_SIZE: '{{default "5Gi" .WP_PVC_MYSQL_SIZE}}'
  WP_PV_FS_GROUP: '{{default "2000" .WP_PV_FS_GROUP}}'

  # -------------------------------------------------------------------
  # Demo components: Headlamp
  # -------------------------------------------------------------------
  HEADLAMP_NS: '{{default "kube-system" .HEADLAMP_NS}}'
  HEADLAMP_RELEASE: '{{default "headlamp" .HEADLAMP_RELEASE}}'
  HEADLAMP_CHART: '{{default "headlamp/headlamp" .HEADLAMP_CHART}}'
  HEADLAMP_CHART_VERSION: '{{default "" .HEADLAMP_CHART_VERSION}}'

  # Match Headlamp docs by default (SA + ClusterRoleBinding to cluster-admin),
  # but allow safer overrides:
  #   HEADLAMP_CLUSTERROLE=view
  #   HEADLAMP_TOKEN_DURATION=15m
  HEADLAMP_SA: '{{default "headlamp-admin" .HEADLAMP_SA}}'
  HEADLAMP_CLUSTERROLE: '{{default "cluster-admin" .HEADLAMP_CLUSTERROLE}}'
  HEADLAMP_TOKEN_DURATION: '{{default "1h" .HEADLAMP_TOKEN_DURATION}}'

  # -------------------------------------------------------------------
  # Ingress (NodePort)
  # -------------------------------------------------------------------
  INGRESS_NS: '{{default "ingress-nginx" .INGRESS_NS}}'
  INGRESS_RELEASE: '{{default "ingress-nginx" .INGRESS_RELEASE}}'
  INGRESS_CHART: '{{default "ingress-nginx/ingress-nginx" .INGRESS_CHART}}'
  INGRESS_CHART_VERSION: '{{default "" .INGRESS_CHART_VERSION}}'
  INGRESS_NODEPORT_HTTP: '{{default "30080" .INGRESS_NODEPORT_HTTP}}'
  INGRESS_NODEPORT_HTTPS: '{{default "30443" .INGRESS_NODEPORT_HTTPS}}'
  INGRESS_HOST: '{{default "local.k8s" .INGRESS_HOST}}'

  # Hostname-per-app (derived from INGRESS_HOST)
  WP_HOST: 'wp.{{.INGRESS_HOST}}'
  HEADLAMP_HOST: 'headlamp.{{.INGRESS_HOST}}'

tasks:
  # =====================================================================
  # Public tasks
  # =====================================================================

  default:
    desc: 'List available tasks'
    silent: true
    cmds:
      - task --list

  cluster:up:
    desc: 'Create cluster (VMs + kubeadm + kubeconfig + calico) and wait until Ready'
    silent: true
    cmds:
      - task: cluster:calico
      - task: cluster:wait
      - |
        set -euo pipefail
        mkdir -p '{{.STATE_DIR}}'
        cat > '{{.ENV_OUT}}' <<EOF
        # Source this to talk to the cluster created by this repo.
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        EOF
        echo "Environment written: {{.ENV_OUT}}"
        echo "Run: source {{.ENV_OUT}}"

  cluster:down:
    desc: 'Delete cluster VMs + local state'
    silent: true
    cmds:
      - |
        set -euo pipefail
        for n in {{.NODES}}; do
          if multipass info "$n" >/dev/null 2>&1; then
            echo "Deleting $n..."
            multipass delete -p "$n" >/dev/null 2>&1 || true
          fi
        done
        multipass purge >/dev/null 2>&1 || true
        rm -rf '{{.STATE_DIR}}'
        echo '✓ cluster destroyed'

  cluster:status:
    desc: 'Show cluster nodes'
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! multipass info '{{.CP0}}' >/dev/null 2>&1; then
          echo 'Cluster is not running.'
          echo 'Run: task cluster:up'
          exit 1
        fi
        if [ ! -s '{{.KUBECONFIG_OUT}}' ]; then
          task cluster:kubeconfig >/dev/null
        fi
        KUBECONFIG='{{.KUBECONFIG_OUT}}' kubectl get nodes -o wide

  demo:install:
    desc: 'Install full demo (cluster + storage + apps) and print URLs'
    silent: true
    cmds:
      - task: cluster:up
      - task: storage:local-path:install
      - task: apps:headlamp:install
      - task: apps:wp:up
      - task: apps:ingress:install
      - task: demo:info

  demo:uninstall:
    desc: 'Uninstall demo apps (keeps cluster running)'
    silent: true
    deps: [cluster:ready]
    cmds:
      - task: apps:ingress:uninstall
      - task: apps:wp:down
      - task: apps:headlamp:uninstall
      - |
        echo '✓ demo uninstalled'
        echo '• Cluster still running. To delete VMs/state: task cluster:down'

  demo:info:
    desc: 'Print demo URLs + Headlamp token + /etc/hosts hint'
    silent: true
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        echo '✓ demo ready'
        echo
        echo "Base domain: {{.INGRESS_HOST}}"
        echo "• WordPress:  http://{{.WP_HOST}}:{{.INGRESS_NODEPORT_HTTP}}/"
        echo "• Headlamp:   http://{{.HEADLAMP_HOST}}:{{.INGRESS_NODEPORT_HTTP}}/"
        echo
        echo "Headlamp token (duration: {{.HEADLAMP_TOKEN_DURATION}}):"
        kubectl -n '{{.HEADLAMP_NS}}' create token '{{.HEADLAMP_SA}}' --duration='{{.HEADLAMP_TOKEN_DURATION}}'
        echo
        echo 'Add these to /etc/hosts if the hostnames do not resolve:'
        CP0_IP="$(multipass list --format csv | awk -F, -v n='{{.CP0}}' '$1==n {print $3; exit}')"
        test -n "${CP0_IP:-}"
        echo "${CP0_IP} {{.WP_HOST}}"
        echo "${CP0_IP} {{.HEADLAMP_HOST}}"

  # -------------------------------------------------------------------
  # Cluster readiness helpers
  # -------------------------------------------------------------------

  cluster:wait:
    internal: true
    silent: true
    desc: 'Wait until cluster is usable (API + CNI + nodes Ready)'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        echo 'Waiting for API server responsiveness...'
        for i in $(seq 1 60); do
          if kubectl get nodes >/dev/null 2>&1; then break; fi
          sleep 2
        done
        kubectl get nodes >/dev/null 2>&1 || { echo 'API server not responsive' >&2; exit 1; }

        echo 'Waiting for all nodes to be Ready...'
        kubectl wait node --all --for=condition=Ready --timeout=360s >/dev/null

        echo 'Waiting for kube-system pods to settle...'
        kubectl -n kube-system wait --for=condition=Available deploy/coredns --timeout=240s >/dev/null 2>&1 || true
        kubectl -n kube-system rollout status ds/kube-proxy --timeout=240s >/dev/null 2>&1 || true

        echo '✓ cluster ready'
        kubectl get nodes -o wide

  cluster:ready:
    internal: true
    silent: true
    desc: 'Fail fast if cluster is not reachable'
    cmds:
      - |
        set -euo pipefail
        if ! multipass info '{{.CP0}}' >/dev/null 2>&1; then
          echo 'Cluster is not running (missing multipass instance {{.CP0}}).'
          echo 'Run: task cluster:up'
          exit 1
        fi
        if [ ! -s '{{.KUBECONFIG_OUT}}' ]; then
          task cluster:kubeconfig >/dev/null
        fi
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        kubectl get nodes >/dev/null 2>&1

  # -------------------------------------------------------------------
  # Storage: Rancher local-path-provisioner
  # -------------------------------------------------------------------

  storage:local-path:node-dir:
    internal: true
    silent: true
    desc: 'Ensure local-path provisioner node directory exists on all nodes'
    cmds:
      - |
        set -euo pipefail
        for n in {{.NODES}}; do
          echo "Ensuring {{.LOCAL_PATH_DIR}} on ${n}..."
          multipass exec "$n" -- bash -lc '
            set -euo pipefail
            sudo mkdir -p "{{.LOCAL_PATH_DIR}}"
            sudo chmod 0777 "{{.LOCAL_PATH_DIR}}"
          '
        done

  storage:local-path:install:
    internal: true
    silent: true
    desc: 'Install Rancher local-path-provisioner and set default StorageClass'
    deps: [cluster:ready]
    status:
      - test -f '{{.LOCAL_PATH_STAMP}}'
    cmds:
      - |
        set -euo pipefail
        # Guard: ensure state dir is never "/" (macOS root is read-only)
        test -n '{{.STATE_DIR}}'
        test '{{.STATE_DIR}}' != '/'
        mkdir -p '{{.STATE_DIR}}'
      - task: storage:local-path:node-dir
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        echo "Applying local-path-provisioner: {{.LOCAL_PATH_MANIFEST_URL}}"
        kubectl apply -f '{{.LOCAL_PATH_MANIFEST_URL}}' >/dev/null

        echo "Waiting for local-path-provisioner deployment..."
        kubectl -n '{{.LOCAL_PATH_NS}}' wait --for=condition=Available deploy/local-path-provisioner --timeout=240s >/dev/null

        if ! kubectl get storageclass '{{.LOCAL_PATH_STORAGECLASS}}' >/dev/null 2>&1; then
          echo "Expected StorageClass '{{.LOCAL_PATH_STORAGECLASS}}' not found. Existing storageclasses:"
          kubectl get storageclass
          exit 1
        fi

        for sc in $(kubectl get storageclass -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
          if [ "$sc" != '{{.LOCAL_PATH_STORAGECLASS}}' ]; then
            kubectl patch storageclass "$sc" -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}' >/dev/null 2>&1 || true
          fi
        done
        kubectl patch storageclass '{{.LOCAL_PATH_STORAGECLASS}}' -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}' >/dev/null 2>&1 || true

        touch '{{.LOCAL_PATH_STAMP}}'
        echo "✓ local-path-provisioner ready (default StorageClass: {{.LOCAL_PATH_STORAGECLASS}})"

  # -------------------------------------------------------------------
  # Apps (kept internal; demo:* drives them)
  # -------------------------------------------------------------------

  apps:ingress:install:
    internal: true
    silent: true
    desc: 'Install ingress-nginx (NodePort) and apply ingress rules (waits for webhook ready)'
    deps: [cluster:ready]
    cmds:
      - task: ingress:controller:install
      - task: ingress:rules:apply
      - echo '✓ ingress installed (controller + rules)'

  apps:ingress:uninstall:
    internal: true
    silent: true
    desc: 'Remove ingress rules + uninstall ingress-nginx'
    deps: [cluster:ready]
    cmds:
      - task: ingress:rules:delete
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        helm uninstall '{{.INGRESS_RELEASE}}' -n '{{.INGRESS_NS}}' >/dev/null 2>&1 || true
        kubectl delete ns '{{.INGRESS_NS}}' >/dev/null 2>&1 || true
        rm -f '{{.INGRESS_STAMP}}' >/dev/null 2>&1 || true
        echo '✓ ingress removed (best-effort)'

  apps:headlamp:install:
    internal: true
    silent: true
    desc: 'Install Headlamp (Helm) + ServiceAccount token auth (waits until Ready)'
    deps: [cluster:ready]
    status:
      - test -f '{{.HEADLAMP_STAMP}}'
    cmds:
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ >/dev/null 2>&1 || true
        helm repo update >/dev/null 2>&1 || true

        # kube-system should exist; create anyway just in case user overrides HEADLAMP_NS
        kubectl get ns '{{.HEADLAMP_NS}}' >/dev/null 2>&1 || kubectl create ns '{{.HEADLAMP_NS}}'

        if [ -n '{{.HEADLAMP_CHART_VERSION}}' ]; then
          helm upgrade --install '{{.HEADLAMP_RELEASE}}' '{{.HEADLAMP_CHART}}' \
            -n '{{.HEADLAMP_NS}}' --version '{{.HEADLAMP_CHART_VERSION}}'
        else
          helm upgrade --install '{{.HEADLAMP_RELEASE}}' '{{.HEADLAMP_CHART}}' \
            -n '{{.HEADLAMP_NS}}'
        fi

        # Create a ServiceAccount for Headlamp token login.
        kubectl -n '{{.HEADLAMP_NS}}' get sa '{{.HEADLAMP_SA}}' >/dev/null 2>&1 || \
          kubectl -n '{{.HEADLAMP_NS}}' create serviceaccount '{{.HEADLAMP_SA}}' >/dev/null

        # Bind SA to a ClusterRole (default: cluster-admin to match Headlamp docs).
        # Override: HEADLAMP_CLUSTERROLE=view for least-privilege.
        CRB_NAME='{{.HEADLAMP_SA}}-{{.HEADLAMP_CLUSTERROLE}}'
        kubectl get clusterrolebinding "${CRB_NAME}" >/dev/null 2>&1 || \
          kubectl apply -f - >/dev/null <<EOF
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: ${CRB_NAME}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: {{.HEADLAMP_CLUSTERROLE}}
        subjects:
          - kind: ServiceAccount
            name: {{.HEADLAMP_SA}}
            namespace: {{.HEADLAMP_NS}}
        EOF

        echo 'Waiting for Headlamp deployments to become Available...'
        kubectl -n '{{.HEADLAMP_NS}}' wait --for=condition=Available deploy -l app.kubernetes.io/instance='{{.HEADLAMP_RELEASE}}' --timeout=300s >/dev/null 2>&1 || true

        # If label-based wait didn't match, fall back to a best-effort wait on any deploy named like the release.
        kubectl -n '{{.HEADLAMP_NS}}' wait --for=condition=Available deploy/'{{.HEADLAMP_RELEASE}}' --timeout=300s >/dev/null 2>&1 || true

        mkdir -p '{{.STATE_DIR}}'
        touch '{{.HEADLAMP_STAMP}}'

        echo '✓ headlamp ready'
        kubectl -n '{{.HEADLAMP_NS}}' get pods -o wide | grep -i headlamp || true

  apps:headlamp:uninstall:
    internal: true
    silent: true
    desc: 'Uninstall Headlamp + SA/CRB (best-effort)'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        CRB_NAME='{{.HEADLAMP_SA}}-{{.HEADLAMP_CLUSTERROLE}}'
        helm uninstall '{{.HEADLAMP_RELEASE}}' -n '{{.HEADLAMP_NS}}' >/dev/null 2>&1 || true
        kubectl delete clusterrolebinding "${CRB_NAME}" >/dev/null 2>&1 || true
        kubectl -n '{{.HEADLAMP_NS}}' delete sa '{{.HEADLAMP_SA}}' >/dev/null 2>&1 || true
        rm -f '{{.HEADLAMP_STAMP}}' >/dev/null 2>&1 || true
        echo '✓ headlamp removed (best-effort)'

  apps:wp:up:
    internal: true
    silent: true
    desc: 'Install WordPress (RBAC + CSR users + Helm) (waits until Ready)'
    deps: [cluster:ready]
    cmds:
      - task: wp:ns
      - task: wp:rbac
      - task: wp:user:deployer
      - task: wp:user:accessor
      - task: wp:install
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        echo 'Waiting for WordPress workloads to become Available...'
        kubectl -n '{{.WP_NS}}' wait --for=condition=Available deployment/{{.WP_RELEASE}} --timeout=360s >/dev/null
        kubectl -n '{{.WP_NS}}' wait --for=condition=Available deployment/{{.WP_RELEASE}}-mysql --timeout=360s >/dev/null
      - 'echo "Deployer kubeconfig: {{.WP_DEPLOYER_KUBECONFIG}}"'
      - 'echo "Accessor kubeconfig: {{.WP_ACCESSOR_KUBECONFIG}}"'

  apps:wp:down:
    internal: true
    silent: true
    desc: 'Uninstall WordPress and clean namespace + generated kubeconfigs'
    deps: [cluster:ready]
    cmds:
      - task: wp:uninstall
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        kubectl delete ns '{{.WP_NS}}' >/dev/null 2>&1 || true
        rm -rf '{{.WP_USERS_DIR}}' || true
        echo '✓ wordpress cleaned (best-effort)'

  # -------------------------------------------------------------------
  # Cluster build plumbing
  # -------------------------------------------------------------------

  cluster:preflight:
    silent: true
    desc: 'Preflight checks'
    cmds:
      - |
        set -euo pipefail
        need() { command -v "$1" >/dev/null 2>&1 || { echo "missing dependency: $1" >&2; exit 1; }; }
        need multipass
        need kubectl
        need helm
        need awk
        need sed
        need grep
        need head
        need envsubst
        test -f '{{.CLOUD_INIT_TEMPLATE}}' || { echo "missing: {{.CLOUD_INIT_TEMPLATE}}" >&2; exit 1; }
        test -f '{{.AUDIT_POLICY_TEMPLATE}}' || { echo "missing: {{.AUDIT_POLICY_TEMPLATE}}" >&2; exit 1; }
        test -f '{{.KUBEADM_CONFIG_TEMPLATE}}' || { echo "missing: {{.KUBEADM_CONFIG_TEMPLATE}}" >&2; exit 1; }
        test -f '{{.CALICO_CUSTOM_RESOURCES_TEMPLATE}}' || { echo "missing: {{.CALICO_CUSTOM_RESOURCES_TEMPLATE}}" >&2; exit 1; }

  cluster:render:
    internal: true
    silent: true
    desc: 'Render cloud-init to .state/cloud-init.yaml'
    deps: [cluster:preflight]
    cmds:
      - |
        set -euo pipefail
        mkdir -p '{{.STATE_DIR}}'

        KEY_FILE='{{.SSH_KEY_FILE}}'
        if [ ! -f "$KEY_FILE" ]; then
          for cand in "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/id_rsa.pub" "$HOME/.ssh/id_ecdsa.pub"; do
            if [ -f "$cand" ]; then KEY_FILE="$cand"; break; fi
          done
        fi
        test -f "$KEY_FILE" || { echo "missing SSH public key (set SSH_KEY_FILE=...)" >&2; exit 1; }

        SSH_KEY="$(cat "$KEY_FILE")"
        K8S_MINOR='{{.K8S_VERSION_FULL}}'
        K8S_MINOR="${K8S_MINOR%.*}"

        # Export variables used by rendered templates
        export kubernetes_version_full='{{.K8S_VERSION_FULL}}'
        export kubernetes_version="$K8S_MINOR"
        export pod_cidr='{{.POD_CIDR}}'
        export service_cidr='{{.SERVICE_CIDR}}'
        export dns_domain='{{.DNS_DOMAIN}}'

        # Render the audit policy to a readable artifact in .state/
        cp '{{.AUDIT_POLICY_TEMPLATE}}' '{{.AUDIT_POLICY_RENDERED}}'
        test -s '{{.AUDIT_POLICY_RENDERED}}' || { echo "render failed: empty {{.AUDIT_POLICY_RENDERED}}" >&2; exit 1; }
        chmod 0644 '{{.AUDIT_POLICY_RENDERED}}'

        # Render kubeadm config to a readable artifact in .state/ (no inline YAML in cloud-init)
        envsubst \
          '${kubernetes_version_full} ${service_cidr} ${pod_cidr} ${dns_domain}' \
          < '{{.KUBEADM_CONFIG_TEMPLATE}}' \
          > '{{.KUBEADM_CONFIG_RENDERED}}'
        test -s '{{.KUBEADM_CONFIG_RENDERED}}' || { echo "render failed: empty {{.KUBEADM_CONFIG_RENDERED}}" >&2; exit 1; }
        chmod 0644 '{{.KUBEADM_CONFIG_RENDERED}}'

        # Render Calico custom resources (Installation + APIServer) to .state/
        envsubst \
          '${pod_cidr}' \
          < '{{.CALICO_CUSTOM_RESOURCES_TEMPLATE}}' \
          > '{{.CALICO_CUSTOM_RESOURCES_RENDERED}}'
        test -s '{{.CALICO_CUSTOM_RESOURCES_RENDERED}}' || { echo "render failed: empty {{.CALICO_CUSTOM_RESOURCES_RENDERED}}" >&2; exit 1; }
        chmod 0644 '{{.CALICO_CUSTOM_RESOURCES_RENDERED}}'

        # Indent all but the first line so it nests under cloud-init "content: |"
        audit_policy="$(sed '1!s/^/      /' '{{.AUDIT_POLICY_RENDERED}}')"
        kubeadm_config="$(sed '1!s/^/      /' '{{.KUBEADM_CONFIG_RENDERED}}')"

        export ssh_key="$SSH_KEY"
        export audit_policy
        export kubeadm_config

        envsubst \
          '${ssh_key} ${kubernetes_version_full} ${kubernetes_version} ${pod_cidr} ${service_cidr} ${dns_domain} ${audit_policy} ${kubeadm_config}' \
          < '{{.CLOUD_INIT_TEMPLATE}}' \
          > '{{.CLOUD_INIT_RENDERED}}'

        test -s '{{.CLOUD_INIT_RENDERED}}' || { echo "render failed: empty {{.CLOUD_INIT_RENDERED}}" >&2; exit 1; }
        head -n1 '{{.CLOUD_INIT_RENDERED}}' | grep -q '^#cloud-config' || { echo "render sanity check failed (first line must be #cloud-config)" >&2; exit 1; }

        chmod 0644 '{{.CLOUD_INIT_RENDERED}}'
        echo "Rendered: {{.CLOUD_INIT_RENDERED}}"
        echo "Rendered: {{.AUDIT_POLICY_RENDERED}}"
        echo "Rendered: {{.KUBEADM_CONFIG_RENDERED}}"
        echo "Rendered: {{.CALICO_CUSTOM_RESOURCES_RENDERED}}"
        echo "Using SSH key: ${KEY_FILE}"

  cluster:vms:
    internal: true
    silent: true
    desc: 'Launch multipass VMs (idempotent)'
    deps: [cluster:render]
    cmds:
      - |
        set -euo pipefail
        CLOUD='{{.CLOUD_INIT_RENDERED}}'
        test -s "$CLOUD" || { echo "missing cloud-init: $CLOUD" >&2; exit 1; }

        launch() {
          local name="$1"
          if multipass info "$name" >/dev/null 2>&1; then
            echo "✓ exists: $name"
            return 0
          fi

          multipass launch \
            --name "$name" \
            --memory '{{.MP_MEM}}' \
            --disk '{{.MP_DISK}}' \
            --cpus '{{.MP_CPUS}}' \
            --cloud-init "$CLOUD" \
            '{{.MP_IMAGE}}' >/dev/null

          echo "✓ launched: $name"
        }

        echo 'Launching VMs (idempotent)...'
        launch '{{.CP0}}'
        launch 'worker-0'
        launch 'worker-1'
        multipass list

  cluster:init:
    internal: true
    silent: true
    desc: 'kubeadm init (idempotent)'
    deps: [cluster:vms]
    status:
      - multipass exec '{{.CP0}}' -- bash -lc 'test -f /etc/kubernetes/admin.conf' >/dev/null 2>&1
    cmds:
      - |
        set -euo pipefail
        echo 'Initializing control-plane on {{.CP0}}...'
        multipass exec '{{.CP0}}' -- bash -lc '
          set -euo pipefail
          IP="$(ip -4 route get 1.1.1.1 | awk "{print \$7; exit}")"
          if grep -q "__CP0_ADVERTISE_ADDRESS__" /etc/kubernetes/kubeadm-config.yaml; then
            sudo sed -i "s/__CP0_ADVERTISE_ADDRESS__/${IP}/g" /etc/kubernetes/kubeadm-config.yaml
          fi
          sudo kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
          echo "✓ initialized"
        '

  cluster:join:
    internal: true
    silent: true
    desc: 'Join workers (idempotent)'
    deps: [cluster:init]
    cmds:
      - |
        set -euo pipefail
        echo 'Creating join command ({{.CP0}})...'
        JOIN_BASE="$(multipass exec '{{.CP0}}' -- bash -lc 'sudo kubeadm token create --print-join-command')"

        joined_worker() {
          local name="$1"
          multipass exec "$name" -- bash -lc \
            'test -f /etc/kubernetes/kubelet.conf && test -f /etc/kubernetes/pki/ca.crt' \
            >/dev/null 2>&1
        }

        for w in {{.WORKERS}}; do
          if joined_worker "$w"; then
            echo "✓ already joined: $w"
            continue
          fi
          echo "Joining worker $w..."
          multipass exec "$w" -- bash -lc "sudo ${JOIN_BASE} --cri-socket unix:///run/containerd/containerd.sock"
          echo "✓ joined: $w"
        done

  cluster:kubeconfig:
    internal: true
    silent: true
    desc: 'Write kubeconfig to .state/kubeconfig'
    deps: [cluster:join]
    cmds:
      - |
        set -euo pipefail
        mkdir -p '{{.STATE_DIR}}'

        CP0_IP="$(multipass list --format csv | awk -F, -v n='{{.CP0}}' '$1==n {print $3; exit}')"
        test -n "${CP0_IP:-}"

        multipass exec '{{.CP0}}' -- bash -lc 'sudo cat /etc/kubernetes/admin.conf' \
          | sed -E "s#server: https://[^:]+:6443#server: https://${CP0_IP}:6443#" \
          > '{{.KUBECONFIG_OUT}}'

        chmod 0600 '{{.KUBECONFIG_OUT}}'
        echo "Wrote kubeconfig: {{.KUBECONFIG_OUT}}"

  cluster:calico:
    internal: true
    silent: true
    desc: 'Install Calico (Tigera operator) (idempotent via stamp)'
    deps: [cluster:kubeconfig]
    status:
      - test -f '{{.CALICO_STAMP}}'
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        kubectl get ns tigera-operator >/dev/null 2>&1 || kubectl create ns tigera-operator

        echo 'Applying Tigera operator CRDs...'
        kubectl apply --server-side --force-conflicts \
          -f 'https://raw.githubusercontent.com/projectcalico/calico/{{.CALICO_VERSION}}/manifests/operator-crds.yaml'

        echo 'Applying Tigera operator...'
        kubectl apply --server-side --force-conflicts \
          -f 'https://raw.githubusercontent.com/projectcalico/calico/{{.CALICO_VERSION}}/manifests/tigera-operator.yaml'

        echo 'Waiting for tigera-operator deployment...'
        kubectl -n tigera-operator wait --for=condition=Available deployment/tigera-operator --timeout=240s >/dev/null

        echo 'Applying Calico custom resources (rendered)...'
        kubectl apply --server-side --force-conflicts -f '{{.CALICO_CUSTOM_RESOURCES_RENDERED}}' >/dev/null

        echo 'Waiting for calico-system namespace and calico-node...'
        for i in $(seq 1 60); do
          if kubectl get ns calico-system >/dev/null 2>&1; then break; fi
          sleep 2
        done
        kubectl get ns calico-system >/dev/null 2>&1 || { echo 'calico-system namespace not created' >&2; exit 1; }

        echo 'Waiting for calico-node rollout...'
        kubectl -n calico-system rollout status ds/calico-node --timeout=360s >/dev/null

        touch '{{.CALICO_STAMP}}'
        echo '✓ calico ready'

  # -------------------------------------------------------------------
  # Ingress controller + rules
  # -------------------------------------------------------------------

  ingress:controller:install:
    internal: true
    silent: true
    desc: 'Install ingress-nginx controller (NodePort) (idempotent via stamp)'
    deps: [cluster:ready]
    status:
      - test -f '{{.INGRESS_STAMP}}'
    cmds:
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx >/dev/null 2>&1 || true
        helm repo update >/dev/null 2>&1 || true

        kubectl get ns '{{.INGRESS_NS}}' >/dev/null 2>&1 || kubectl create ns '{{.INGRESS_NS}}'

        if [ -n '{{.INGRESS_CHART_VERSION}}' ]; then
          helm upgrade --install '{{.INGRESS_RELEASE}}' '{{.INGRESS_CHART}}' -n '{{.INGRESS_NS}}' \
            --version '{{.INGRESS_CHART_VERSION}}' \
            --set controller.service.type=NodePort \
            --set controller.service.nodePorts.http='{{.INGRESS_NODEPORT_HTTP}}' \
            --set controller.service.nodePorts.https='{{.INGRESS_NODEPORT_HTTPS}}'
        else
          helm upgrade --install '{{.INGRESS_RELEASE}}' '{{.INGRESS_CHART}}' -n '{{.INGRESS_NS}}' \
            --set controller.service.type=NodePort \
            --set controller.service.nodePorts.http='{{.INGRESS_NODEPORT_HTTP}}' \
            --set controller.service.nodePorts.https='{{.INGRESS_NODEPORT_HTTPS}}'
        fi

        echo 'Waiting for ingress-nginx controller to be Available...'
        kubectl -n '{{.INGRESS_NS}}' wait --for=condition=Available deployment/ingress-nginx-controller --timeout=240s >/dev/null

        echo 'Waiting for admission webhook endpoints (avoids connect refused)...'
        for i in $(seq 1 60); do
          EP="$(kubectl -n '{{.INGRESS_NS}}' get endpoints ingress-nginx-controller-admission -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null || true)"
          if [ -n "${EP:-}" ]; then break; fi
          sleep 2
        done
        test -n "${EP:-}" || { echo 'admission webhook endpoint not ready' >&2; exit 1; }

        mkdir -p '{{.STATE_DIR}}'
        touch '{{.INGRESS_STAMP}}'

        echo '✓ ingress-nginx ready'
        kubectl -n '{{.INGRESS_NS}}' get svc -o wide

  ingress:rules:apply:
    internal: true
    silent: true
    desc: 'Apply ingress rules for WordPress + Headlamp (hostname-per-app)'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'

        # --- WordPress service name (robust to release naming) ---
        WP_CHART_NAME='custom-wordpress'
        if echo '{{.WP_RELEASE}}' | grep -q "$WP_CHART_NAME"; then
          WP_SVC='{{.WP_RELEASE}}'
        else
          WP_SVC="{{.WP_RELEASE}}-${WP_CHART_NAME}"
        fi

        kubectl -n '{{.WP_NS}}' apply -f - <<EOF
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: wp
          labels:
            app.kubernetes.io/part-of: custom-wordpress
        spec:
          ingressClassName: nginx
          rules:
            - host: {{.WP_HOST}}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${WP_SVC}
                        port:
                          number: 80
        EOF
        echo '✓ wp ingress applied'

        # --- Headlamp service name (robust to release naming) ---
        HEADLAMP_CHART_NAME='headlamp'
        if echo '{{.HEADLAMP_RELEASE}}' | grep -q "$HEADLAMP_CHART_NAME"; then
          HEADLAMP_SVC='{{.HEADLAMP_RELEASE}}'
        else
          HEADLAMP_SVC="{{.HEADLAMP_RELEASE}}-${HEADLAMP_CHART_NAME}"
        fi

        kubectl -n '{{.HEADLAMP_NS}}' apply -f - <<EOF
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: headlamp
          labels:
            app.kubernetes.io/part-of: headlamp
        spec:
          ingressClassName: nginx
          rules:
            - host: {{.HEADLAMP_HOST}}
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ${HEADLAMP_SVC}
                        port:
                          number: 80
        EOF
        echo '✓ headlamp ingress applied'

  ingress:rules:delete:
    internal: true
    silent: true
    desc: 'Delete ingress rules (best-effort)'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        kubectl -n '{{.WP_NS}}' delete ingress wp >/dev/null 2>&1 || true
        kubectl -n '{{.HEADLAMP_NS}}' delete ingress headlamp >/dev/null 2>&1 || true
        echo '✓ ingress rules deleted (best-effort)'

  # -------------------------------------------------------------------
  # WordPress plumbing (dynamic provisioning via local-path)
  # -------------------------------------------------------------------

  wp:ns:
    internal: true
    silent: true
    desc: 'Ensure WordPress namespace exists'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        kubectl get ns '{{.WP_NS}}' >/dev/null 2>&1 || kubectl create ns '{{.WP_NS}}'

  wp:rbac:
    internal: true
    silent: true
    desc: 'Apply WordPress RBAC'
    deps: [wp:ns]
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        test -d '{{.WP_RBAC_DIR}}' || { echo "missing: {{.WP_RBAC_DIR}}" >&2; exit 1; }

        kubectl -n '{{.WP_NS}}' apply -f '{{.WP_RBAC_DIR}}/10-role-wp-deployer.yaml'
        kubectl -n '{{.WP_NS}}' apply -f '{{.WP_RBAC_DIR}}/11-rolebinding-wp-deployer.yaml'
        kubectl -n '{{.WP_NS}}' apply -f '{{.WP_RBAC_DIR}}/20-role-wp-accessor.yaml'
        kubectl -n '{{.WP_NS}}' apply -f '{{.WP_RBAC_DIR}}/21-rolebinding-wp-accessor.yaml'

  wp:user:deployer:
    internal: true
    silent: true
    desc: 'Create deployer user kubeconfig (CSR)'
    deps: [wp:ns]
    cmds:
      - task: wp:csr-user
        vars:
          USERNAME: '{{.WP_DEPLOYER_USER}}'
          GROUP: '{{.WP_DEPLOYER_GROUP}}'
          OUT: '{{.WP_DEPLOYER_KUBECONFIG}}'

  wp:user:accessor:
    internal: true
    silent: true
    desc: 'Create accessor user kubeconfig (CSR)'
    deps: [wp:ns]
    cmds:
      - task: wp:csr-user
        vars:
          USERNAME: '{{.WP_ACCESSOR_USER}}'
          GROUP: '{{.WP_ACCESSOR_GROUP}}'
          OUT: '{{.WP_ACCESSOR_KUBECONFIG}}'

  wp:install:
    internal: true
    silent: true
    desc: 'Install WordPress Helm chart (uses local-path StorageClass)'
    deps: [wp:ns]
    cmds:
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        test -d '{{.WP_CHART}}' || { echo "missing: {{.WP_CHART}}" >&2; exit 1; }

        mkdir -p '{{.STATE_DIR}}'
        OVERRIDE='{{.STATE_DIR}}/wp-values-override.yaml'
        cat > "$OVERRIDE" <<EOF
        wordpress:
          nodeSelector:
            kubernetes.io/hostname: {{.WP_STORAGE_NODE}}
          podSecurityContext:
            fsGroup: {{.WP_PV_FS_GROUP}}
          persistence:
            storageClassName: '{{.WP_STORAGE_CLASS}}'
            size: '{{.WP_PVC_WP_SIZE}}'

        mysql:
          nodeSelector:
            kubernetes.io/hostname: {{.WP_STORAGE_NODE}}
          podSecurityContext:
            fsGroup: {{.WP_PV_FS_GROUP}}
          persistence:
            storageClassName: '{{.WP_STORAGE_CLASS}}'
            size: '{{.WP_PVC_MYSQL_SIZE}}'
        EOF

        export KUBECONFIG='{{.WP_DEPLOYER_KUBECONFIG}}'
        helm upgrade --install '{{.WP_RELEASE}}' '{{.WP_CHART}}' -n '{{.WP_NS}}' -f "$OVERRIDE"

  wp:uninstall:
    internal: true
    silent: true
    desc: 'Uninstall WordPress Helm release (best-effort)'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        command -v helm >/dev/null 2>&1 || { echo 'missing dependency: helm' >&2; exit 1; }
        if [ -s '{{.WP_DEPLOYER_KUBECONFIG}}' ]; then
          export KUBECONFIG='{{.WP_DEPLOYER_KUBECONFIG}}'
          helm uninstall '{{.WP_RELEASE}}' -n '{{.WP_NS}}' >/dev/null 2>&1 || true
        fi

  wp:csr-user:
    internal: true
    silent: true
    desc: 'Issue a CSR user kubeconfig in the WordPress namespace'
    deps: [cluster:ready]
    cmds:
      - |
        set -euo pipefail
        need() { command -v "$1" >/dev/null 2>&1 || { echo "missing dependency: $1" >&2; exit 1; }; }
        need openssl
        need base64
        need kubectl

        export KUBECONFIG='{{.KUBECONFIG_OUT}}'
        mkdir -p '{{.WP_USERS_DIR}}'

        USER='{{.USERNAME}}'
        GROUP='{{.GROUP}}'
        OUT='{{.OUT}}'
        NS='{{.WP_NS}}'

        if [ -s "$OUT" ] && [ "${FORCE:-0}" != '1' ]; then
          exit 0
        fi
        if [ -s "$OUT" ] && [ "${FORCE:-0}" = '1' ]; then
          rm -f "$OUT"
        fi

        WORKDIR="$(mktemp -d)"
        trap 'rm -rf "$WORKDIR"' EXIT

        openssl genrsa -out "$WORKDIR/client.key" 2048 >/dev/null 2>&1
        openssl req -new -key "$WORKDIR/client.key" -out "$WORKDIR/client.csr" -subj "/CN=${USER}/O=${GROUP}" >/dev/null 2>&1

        CSR_B64="$(base64 < "$WORKDIR/client.csr" | tr -d '\n')"
        CSR_NAME="csr-${USER}-${NS}"

        kubectl delete csr "${CSR_NAME}" >/dev/null 2>&1 || true
        kubectl apply -f - >/dev/null <<EOF
        apiVersion: certificates.k8s.io/v1
        kind: CertificateSigningRequest
        metadata:
          name: ${CSR_NAME}
        spec:
          request: ${CSR_B64}
          signerName: kubernetes.io/kube-apiserver-client
          usages: [client auth]
        EOF

        kubectl certificate approve "${CSR_NAME}" >/dev/null

        CERT_B64=''
        for i in $(seq 1 30); do
          CERT_B64="$(kubectl get csr "${CSR_NAME}" -o jsonpath='{.status.certificate}' 2>/dev/null || true)"
          if [ -n "$CERT_B64" ]; then break; fi
          sleep 1
        done
        test -n "${CERT_B64:-}" || { echo "CSR did not receive a certificate: ${CSR_NAME}" >&2; exit 1; }
        echo "$CERT_B64" | base64 -d > "$WORKDIR/client.crt"

        CLUSTER_NAME="$(kubectl config view --kubeconfig='{{.KUBECONFIG_OUT}}' -o jsonpath='{.clusters[0].name}')"
        SERVER="$(kubectl config view --kubeconfig='{{.KUBECONFIG_OUT}}' -o jsonpath='{.clusters[0].cluster.server}')"
        CA_DATA="$(kubectl config view --kubeconfig='{{.KUBECONFIG_OUT}}' --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')"
        echo "$CA_DATA" | base64 -d > "$WORKDIR/ca.crt"

        kubectl config --kubeconfig="$OUT" set-cluster "$CLUSTER_NAME" --server="$SERVER" --certificate-authority="$WORKDIR/ca.crt" --embed-certs=true >/dev/null
        kubectl config --kubeconfig="$OUT" set-credentials "$USER" --client-certificate="$WORKDIR/client.crt" --client-key="$WORKDIR/client.key" --embed-certs=true >/dev/null
        kubectl config --kubeconfig="$OUT" set-context "${USER}@${CLUSTER_NAME}" --cluster="$CLUSTER_NAME" --user="$USER" --namespace="$NS" >/dev/null
        kubectl config --kubeconfig="$OUT" use-context "${USER}@${CLUSTER_NAME}" >/dev/null

        chmod 0600 "$OUT"
        echo "Wrote kubeconfig: $OUT"

