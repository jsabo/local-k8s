apiVersion: v1
kind: Service
metadata:
  name: {{ include "custom-wordpress.fullname" . }}-mysql
  labels:
    {{- include "custom-wordpress.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
  selector:
    {{- include "custom-wordpress.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
