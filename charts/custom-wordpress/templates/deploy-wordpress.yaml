apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "custom-wordpress.fullname" . }}
  labels:
    {{- include "custom-wordpress.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: {{ .Values.wordpress.replicaCount }}
  selector:
    matchLabels:
      {{- include "custom-wordpress.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        {{- include "custom-wordpress.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
    spec:
      {{- with .Values.wordpress.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for MySQL..."
              for i in $(seq 1 120); do
                mysqladmin ping \
                  -h {{ include "custom-wordpress.fullname" . }}-mysql \
                  -P {{ .Values.mysql.service.port }} \
                  -u root \
                  --silent && exit 0
                sleep 2
              done
              echo "MySQL did not become ready in time" >&2
              exit 1
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-wordpress.secretName" . }}
                  key: mysql-root-password
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          {{- with .Values.wordpress.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "custom-wordpress.fullname" . }}-mysql:{{ .Values.mysql.service.port }}"
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-wordpress.secretName" . }}
                  key: wordpress-db
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-wordpress.secretName" . }}
                  key: wordpress-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "custom-wordpress.secretName" . }}
                  key: wordpress-password
            {{- range $k, $v := .Values.wordpress.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /wp-admin/install.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          {{- if .Values.wordpress.resources }}
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wp-data
              mountPath: /var/www/html
      volumes:
        - name: wp-data
          {{- if .Values.wordpress.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "custom-wordpress.fullname" . }}-wp
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.wordpress.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wordpress.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wordpress.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
