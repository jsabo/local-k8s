# Default values for custom-wordpress.
# This chart intentionally stays small and transparent (no vendor chart reuse).

nameOverride: ""
fullnameOverride: ""

wordpress:
  image:
    repository: wordpress
    tag: "6.4.3-php8.2-apache"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod-level security context (e.g., fsGroup for PV permissions)
  podSecurityContext: {}

  # Container-level security context (optional hardening)
  securityContext: {}

  persistence:
    enabled: true
    # Leave empty to use the cluster default StorageClass.
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # Extra environment variables (key: value)
  extraEnv: {}

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  service:
    port: 3306

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext: {}
  securityContext: {}

  persistence:
    enabled: true
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # Basic health probes for MySQL (recommended)
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6

# Credentials are stored in a Kubernetes Secret created by this chart (unless you supply an existing one).
auth:
  # If true, chart will create a Secret (unless existingSecret is set).
  create: true

  # If set, chart will NOT create a Secret and will reference this one instead.
  # It must contain these keys:
  # - mysql-root-password
  # - wordpress-db
  # - wordpress-user
  # - wordpress-password
  existingSecret: ""

  # If create=true and passwords are empty, chart will generate random passwords.
  # The chart preserves generated passwords across upgrades by reusing existing Secret values.
  mysqlRootPassword: ""
  wordpressDatabase: "wordpress"
  wordpressUser: "wordpress"
  wordpressPassword: ""

# Optional: if you want to expose via Ingress (Level 7), enable and set your controller specifics.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wordpress.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
