apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wp-accessor
rules:
  # Read-only access for discovery.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

  # Port-forward is a SUBRESOURCE; it requires 'create' on pods/portforward.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

  # Optional: allow reading logs for troubleshooting.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
